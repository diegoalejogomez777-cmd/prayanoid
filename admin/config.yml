backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

locale: "es"

collections:
  - name: "tienda"
    label: "Tienda"
    files:
      - name: "productos"
        label: "Camisetas"
        file: "content/products.json"
        fields:
          - label: "Camisetas"
            name: "products"
            widget: "list"
            label_singular: "Camiseta"
            summary: "{{name}} — ${{price}}"
            fields:
              - { label: "ID interno (sin espacios)", name: "id", widget: "string" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Precio (COP, solo número)", name: "price", widget: "number", value_type: "int" }
              - { label: "Descripción", name: "desc", widget: "text" }
              - { label: "Foto de adelante", name: "image", widget: "image" }
              - { label: "Foto de atrás (opcional, agrega botón para verla)", name: "imageBack", widget: "image", required: false }
              - { label: "Talla", name: "size", widget: "string", default: "S" }
              - { label: "¿Permite personalización?", name: "customizable", widget: "boolean", default: true }

  - name: "comic"
    label: "Cómic"
    files:
      - name: "episodios"
        label: "Episodios"
        file: "content/comics.json"
        fields:
          - label: "Episodios"
            name: "comics"
            widget: "list"
            label_singular: "Episodio"
            summary: "{{id}} — {{title}} ({{status}})"
            min: 3
            max: 3
            hint: "Hay exactamente 3 episodios porque cada uno tiene su propia página. No cambies el ID (00, 01, 02) ni agregues o borres episodios aquí — si quieres uno nuevo, pide que te ayuden a crear su página primero."
            fields:
              - { label: "ID (no lo cambies: 00, 01 o 02)", name: "id", widget: "string" }
              - { label: "Título del episodio", name: "title", widget: "string" }
              - { label: "Estado (texto libre, ej: Disponible ahora / Próximamente)", name: "status", widget: "string" }
              - { label: "¿Ya está publicado?", name: "live", widget: "boolean", default: false }
              - { label: "Mensaje mientras no hay páginas subidas", name: "message", widget: "text" }
              - { label: "Portada (se ve en la tarjeta de la portada)", name: "cover", widget: "image", required: false }
              - label: "Páginas del cómic"
                name: "pages"
                widget: "list"
                required: false
                hint: "Sube las imágenes en el orden en que se deben leer."
                field: { label: "Imagen de la página", name: "image", widget: "image" }

  - name: "colecciones"
    label: "Colecciones y Eventos"
    files:
      - name: "colecciones"
        label: "Colecciones"
        file: "content/collections.json"
        fields:
          - label: "Colecciones"
            name: "collections"
            widget: "list"
            label_singular: "Colección"
            summary: "{{title}}"
            hint: "Agrega o quita colecciones y eventos de temporada libremente — no hay límite."
            fields:
              - { label: "Nombre de la colección o evento", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text", required: false }
              - label: "Fotos"
                name: "images"
                widget: "list"
                hint: "Agrega o quita las fotos que quieras de esta colección."
                field: { label: "Foto", name: "image", widget: "image" }
